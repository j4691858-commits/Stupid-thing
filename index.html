<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game">
        <div class="left-panel">
            <div class="stats">
                <div class="cookie-count" id="cookieCount">0</div>
                <div class="cookie-label">cookies</div>
                <div class="cps" id="cps">per second: 0</div>
            </div>

            <div class="cookie-area" id="cookieArea">
                <div class="cookie-btn" id="bigCookie">
                    <div class="cookie-inner">&#127850;</div>
                </div>
            </div>

            <div class="click-power">
                Click power: <span id="clickPower">1</span>
            </div>
        </div>

        <div class="right-panel">
            <div class="panel-tabs">
                <button class="tab active" data-tab="buildings" onclick="switchTab('buildings')">Buildings</button>
                <button class="tab" data-tab="upgrades" onclick="switchTab('upgrades')">Upgrades</button>
                <button class="tab" data-tab="stats" onclick="switchTab('stats')">Stats</button>
            </div>

            <div class="tab-content" id="tab-buildings">
                <div id="buildingList" class="building-list"></div>
            </div>

            <div class="tab-content hidden" id="tab-upgrades">
                <div id="upgradeList" class="upgrade-list"></div>
            </div>

            <div class="tab-content hidden" id="tab-stats">
                <div class="stats-panel" id="statsPanel"></div>
            </div>
        </div>
    </div>

    <div class="golden-cookie hidden" id="goldenCookie">&#11088;</div>

    <div class="save-indicator hidden" id="saveIndicator">Game saved!</div>

    <script src="app.js"></script>
</body>
</html>
