<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat the Buzzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        canvas { display: block; margin-top: 10px; }
        #menu, #result {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; background: rgba(10,10,26,0.95); z-index: 20;
        }
        .hidden { display: none !important; }
        h1 { font-size: 2.2rem; color: #ff6b35; }
        h2 { font-size: 1.1rem; color: #aaa; }
        .pick-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }
        .choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px; }
        .btn {
            padding: 10px 18px; border: 2px solid #333; border-radius: 8px;
            background: #16213e; color: #ddd; font-size: 0.9rem; font-weight: 600; cursor: pointer;
        }
        .btn:hover { border-color: #ff6b35; }
        .btn.selected { border-color: #ff6b35; background: #2a1a0a; color: #ff6b35; }
        .btn.go { background: #ff6b35; color: #fff; border-color: #ff6b35; font-size: 1rem; padding: 12px 36px; margin-top: 8px; }
        .btn.go:disabled { opacity: 0.3; cursor: not-allowed; }
        .player-rating { font-size: 0.65rem; color: #888; margin-top: 2px; }
        .result-sub { color: #aaa; font-size: 1rem; }
        .result-score { color: #ffd700; font-size: 1.8rem; font-weight: 800; }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="menu">
    <h1>BEAT THE BUZZER</h1>
    <h2>Make every shot before time runs out</h2>
    <div class="pick-label">Choose Your Player</div>
    <div class="choices" id="playerPicks"></div>
    <div class="pick-label">Choose Your Level</div>
    <div class="choices" id="levelPicks"></div>
    <button class="btn go" id="startBtn" disabled onclick="startGame()">START</button>
</div>

<div id="result" class="hidden">
    <h1 id="resultTitle">BUZZER!</h1>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-score" id="resultScore"></div>
    <button class="btn go" onclick="showMenu()">Play Again</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width = Math.min(window.innerWidth, 900);
const H = canvas.height = Math.min(window.innerHeight - 20, 600);

const PLAYERS = [
    { name: 'Caleb Wilson', rating: 60 },
    { name: 'Cam Boozer', rating: 72 },
    { name: 'Jalen Brunson', rating: 85 },
    { name: 'Luka Doncic', rating: 90 },
    { name: 'Wemby', rating: 93 },
    { name: 'Shai Gilgeous-Alexander', rating: 96 },
    { name: 'LeBron James', rating: 97 },
];
const LEVELS = [
    { name: 'High School', timeMod: 1.3, greenMod: 1.3 },
    { name: 'College', timeMod: 1.0, greenMod: 1.0 },
    { name: 'NBA', timeMod: 0.8, greenMod: 0.8 },
    { name: 'All-Star', timeMod: 0.6, greenMod: 0.6 },
];
const SHOTS = [
    { name: 'Free Throw',    dist: 120, baseGreen: 45, speed: 2.5 },
    { name: 'Floater',       dist: 160, baseGreen: 38, speed: 3.0 },
    { name: 'Mid-Range',     dist: 220, baseGreen: 32, speed: 3.5 },
    { name: 'Three Pointer', dist: 300, baseGreen: 26, speed: 4.0 },
    { name: 'Deep Three',    dist: 380, baseGreen: 20, speed: 4.8 },
    { name: 'Half Court',    dist: 460, baseGreen: 15, speed: 5.5 },
    { name: '3/4 Court',     dist: 580, baseGreen: 10, speed: 6.5 },
    { name: 'Full Court',    dist: 700, baseGreen: 7,  speed: 7.5 },
];

// Hoop position (left side)
const HOOP_X = 90, HOOP_Y = 200, RIM_Y = 210;
const FLOOR_Y = 420;
const BAR_W = 300, BAR_H = 36, BAR_X = W / 2 - BAR_W / 2, BAR_Y = H - 60;

let selectedPlayer = null, selectedLevel = null;
let score = 0, shotIndex = 0, timeLeft = 0;
let needlePos = 0, needleDir = 1, greenStart = 0, greenWidth = 0, needleSpeed = 0;
let timerInterval = null, shooting = false, waitingNext = false, gameActive = false;

// Ball animation
let ballAnim = null; // { t, startX, hit }
let feedbackMsg = '', feedbackColor = '#fff', feedbackLife = 0;

// --- Menu ---
const playerDiv = document.getElementById('playerPicks');
PLAYERS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML = p.name + `<div class="player-rating">OVR ${p.rating}</div>`;
    b.onclick = () => { selectedPlayer = i; playerDiv.querySelectorAll('.btn').forEach((bb, j) => bb.classList.toggle('selected', j === i)); checkReady(); };
    playerDiv.appendChild(b);
});
const levelDiv = document.getElementById('levelPicks');
LEVELS.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = l.name;
    b.onclick = () => { selectedLevel = i; levelDiv.querySelectorAll('.btn').forEach((bb, j) => bb.classList.toggle('selected', j === i)); checkReady(); };
    levelDiv.appendChild(b);
});
function checkReady() { document.getElementById('startBtn').disabled = selectedPlayer === null || selectedLevel === null; }

// --- Draw ---
function drawScene(playerX) {
    // Floor
    ctx.fillStyle = '#b5651d';
    ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(W, FLOOR_Y); ctx.stroke();

    // Backboard
    ctx.fillStyle = '#ccc';
    ctx.fillRect(HOOP_X - 3, HOOP_Y - 50, 6, 70);

    // Pole
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(HOOP_X, HOOP_Y + 20); ctx.lineTo(HOOP_X, FLOOR_Y); ctx.stroke();

    // Rim
    ctx.strokeStyle = '#ee3300';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(HOOP_X, RIM_Y); ctx.lineTo(HOOP_X + 30, RIM_Y); ctx.stroke();

    // Net
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
        const x = HOOP_X + i * 7.5;
        ctx.beginPath(); ctx.moveTo(x, RIM_Y); ctx.lineTo(HOOP_X + 7.5 + (i - 2) * 2, RIM_Y + 30); ctx.stroke();
    }

    // Stick figure player
    const px = playerX;
    const headY = FLOOR_Y - 75;
    const bodyTop = FLOOR_Y - 60;
    const bodyBot = FLOOR_Y - 30;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(px, FLOOR_Y, 15, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs
    ctx.strokeStyle = '#ff6b35';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px - 10, FLOOR_Y); ctx.lineTo(px, bodyBot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px + 10, FLOOR_Y); ctx.lineTo(px, bodyBot); ctx.stroke();

    // Body
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(px, bodyBot); ctx.lineTo(px, bodyTop); ctx.stroke();

    // Arms - shooting pose
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(px, bodyTop); ctx.lineTo(px - 15, bodyTop - 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px, bodyTop); ctx.lineTo(px + 12, bodyTop + 10); ctx.stroke();

    // Head
    ctx.fillStyle = '#ff6b35';
    ctx.beginPath();
    ctx.arc(px, headY, 10, 0, Math.PI * 2);
    ctx.fill();
}

function drawBall(bx, by) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(bx, FLOOR_Y, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ball
    ctx.fillStyle = '#e8871e';
    ctx.beginPath();
    ctx.arc(bx, by, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#a05a10';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Lines on ball
    ctx.strokeStyle = 'rgba(80,40,0,0.4)';
    ctx.beginPath(); ctx.moveTo(bx - 10, by); ctx.lineTo(bx + 10, by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by - 10); ctx.lineTo(bx, by + 10); ctx.stroke();
}

function getBallPos(t, startX, hit) {
    const endX = HOOP_X + 15;
    const endY = RIM_Y;
    const x = startX + (endX - startX) * t;
    const dist = startX - endX;
    const peakHeight = 80 + dist * 0.15;
    const arcY = FLOOR_Y - 80;
    const y = arcY - peakHeight * 4 * t * (1 - t) + (endY - arcY) * t;

    if (!hit && t > 0.85) {
        const b = (t - 0.85) * 6;
        return { x: x + b * 30, y: y + b * 50 };
    }
    return { x, y };
}

function drawTimingBar() {
    // Background
    ctx.fillStyle = '#111';
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(BAR_X, BAR_Y, BAR_W, BAR_H, 6);
    ctx.fill();
    ctx.stroke();

    // Green zone
    ctx.fillStyle = 'rgba(0,200,80,0.3)';
    ctx.fillRect(BAR_X + greenStart, BAR_Y + 1, greenWidth, BAR_H - 2);
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(BAR_X + greenStart, BAR_Y); ctx.lineTo(BAR_X + greenStart, BAR_Y + BAR_H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(BAR_X + greenStart + greenWidth, BAR_Y); ctx.lineTo(BAR_X + greenStart + greenWidth, BAR_Y + BAR_H); ctx.stroke();

    // Needle
    if (!waitingNext) {
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 8;
        ctx.fillRect(BAR_X + needlePos - 1.5, BAR_Y, 3, BAR_H);
        ctx.shadowBlur = 0;
    }

    // Label
    ctx.fillStyle = '#666';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SPACE / Click / Tap when the line is in the green', W / 2, BAR_Y + BAR_H + 14);
}

function drawHUD() {
    // Score
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('Score: ' + score, 16, 30);

    // Shot name
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6b35';
    ctx.font = 'bold 18px sans-serif';
    const shot = SHOTS[shotIndex];
    ctx.fillText(shot ? shot.name : '', W / 2, 30);

    // Timer
    ctx.textAlign = 'right';
    ctx.fillStyle = timeLeft < 5 ? '#ff2222' : '#fff';
    ctx.font = 'bold 24px monospace';
    ctx.fillText(timeLeft.toFixed(1), W - 16, 32);

    // Shot counter
    ctx.font = '12px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(`${Math.min(shotIndex + 1, SHOTS.length)}/${SHOTS.length}`, W - 16, 50);
}

function drawFeedback() {
    if (feedbackLife <= 0) return;
    feedbackLife--;
    const alpha = Math.min(feedbackLife / 15, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 44px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = feedbackColor;
    ctx.shadowColor = feedbackColor;
    ctx.shadowBlur = 15;
    ctx.fillText(feedbackMsg, W / 2, 180);
    ctx.restore();
    ctx.shadowBlur = 0;
}

// --- Game Logic ---
function startGame() {
    score = 0; shotIndex = 0; timeLeft = 24.0;
    gameActive = true; ballAnim = null;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('result').classList.add('hidden');
    setupShot();
    startTimer();
}

function setupShot() {
    const shot = SHOTS[shotIndex];
    const player = PLAYERS[selectedPlayer];
    const level = LEVELS[selectedLevel];
    const ratingBonus = (player.rating - 60) / 37 * 0.6 + 0.7;
    greenWidth = Math.max(shot.baseGreen * ratingBonus * level.greenMod, 5);
    needleSpeed = shot.speed / level.timeMod;
    greenStart = Math.random() * (BAR_W - greenWidth - 20) + 10;
    needlePos = 0; needleDir = 1;
    shooting = false; waitingNext = false;
    ballAnim = null;
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) { timeLeft = 0; clearInterval(timerInterval); endGame(); }
    }, 100);
}

function shoot() {
    if (shooting || waitingNext || !gameActive) return;
    shooting = true;
    const hit = needlePos >= greenStart && needlePos <= greenStart + greenWidth;
    const shot = SHOTS[shotIndex];
    const playerX = HOOP_X + shot.dist;
    ballAnim = { t: 0, startX: playerX - 15, hit };

    if (hit) {
        const dist = needlePos - greenStart;
        const center = greenWidth / 2;
        const accuracy = 1 - Math.abs(dist - center) / center;
        let msg, color;
        if (accuracy > 0.85) { msg = 'PERFECT!'; color = '#00ff88'; }
        else if (accuracy > 0.5) { msg = 'SWISH!'; color = '#44dd44'; }
        else { msg = 'Good!'; color = '#88cc44'; }
        setTimeout(() => { feedbackMsg = msg; feedbackColor = color; feedbackLife = 50; score++; }, 600);
        waitingNext = true;
        setTimeout(() => { shotIndex++; if (shotIndex >= SHOTS.length) endGame(true); else setupShot(); }, 1300);
    } else {
        setTimeout(() => { feedbackMsg = 'MISS!'; feedbackColor = '#ff4444'; feedbackLife = 50; }, 600);
        waitingNext = true;
        setTimeout(() => setupShot(), 1300);
    }
}

function endGame(allMade) {
    gameActive = false;
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('result').classList.remove('hidden');
    const player = PLAYERS[selectedPlayer];
    const level = LEVELS[selectedLevel];
    const title = document.getElementById('resultTitle');
    if (allMade) { title.textContent = 'YOU WIN!'; title.style.color = '#00ff88'; }
    else { title.textContent = 'BUZZER!'; title.style.color = '#ff4444'; }
    document.getElementById('resultSub').textContent = `${player.name} on ${level.name}`;
    document.getElementById('resultScore').textContent = score + ' / ' + SHOTS.length + ' shots made';
}

function showMenu() {
    document.getElementById('result').classList.add('hidden');
    document.getElementById('menu').classList.remove('hidden');
    gameActive = false;
    selectedPlayer = null; selectedLevel = null;
    playerDiv.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
    levelDiv.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('startBtn').disabled = true;
}

// --- Input ---
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); shoot(); } });
canvas.addEventListener('click', () => { if (gameActive) shoot(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (gameActive) shoot(); });

// --- Main Loop ---
function loop() {
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    const shot = SHOTS[shotIndex];
    const playerX = shot ? HOOP_X + shot.dist : HOOP_X + 200;

    // Scroll camera to keep player and hoop visible
    const viewRight = Math.max(playerX + 50, W);
    const scrollX = Math.max(0, viewRight - W);

    ctx.save();
    ctx.translate(-scrollX, 0);

    drawScene(playerX);

    // Ball
    if (ballAnim) {
        ballAnim.t += 0.025;
        if (ballAnim.t > 1) ballAnim.t = 1;
        const bp = getBallPos(ballAnim.t, ballAnim.startX, ballAnim.hit);
        drawBall(bp.x, bp.y);
    } else if (gameActive) {
        drawBall(playerX - 15, FLOOR_Y - 70);
    }

    ctx.restore();

    if (gameActive) {
        // Needle
        if (!shooting && !waitingNext) {
            needlePos += needleDir * needleSpeed;
            if (needlePos >= BAR_W - 3) { needlePos = BAR_W - 3; needleDir = -1; }
            if (needlePos <= 0) { needlePos = 0; needleDir = 1; }
        }

        drawTimingBar();
        drawHUD();
        drawFeedback();
    } else {
        // Idle scene
        ctx.save();
        ctx.translate(0, 0);
        drawScene(HOOP_X + 200);
        drawBall(HOOP_X + 185, FLOOR_Y - 70);
        ctx.restore();
    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
