<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        canvas { border-radius: 8px; }

        #ui {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0,0,0,0.7);
            z-index: 10;
        }
        #ui span { color: #ffd700; }

        #msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            text-shadow: 0 3px 10px rgba(0,0,0,0.8);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Speed: <span id="speed">0</span></div>
        <div>Best: <span id="best">0</span></div>
    </div>
    <div id="msg">Press SPACE or Tap to Start</div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const W = 400, H = 700;
        canvas.width = W;
        canvas.height = H;

        const LANE_W = 80, ROAD_L = 60, ROAD_R = W - 60;
        const ROAD_W = ROAD_R - ROAD_L;
        const CAR_W = 40, CAR_H = 70;
        const LANES = [ROAD_L + 30, ROAD_L + 30 + LANE_W, ROAD_L + 30 + LANE_W * 2];

        let player = { x: LANES[1], y: H - 120 };
        let obstacles = [];
        let stripes = [];
        let score = 0, best = parseInt(localStorage.getItem('raceBest')) || 0;
        let gameSpeed = 3, started = false, dead = false;
        let keys = {};
        let targetLane = 1;

        // Init stripes
        for (let y = 0; y < H; y += 40) {
            stripes.push(y);
        }

        document.getElementById('best').textContent = best;

        // Input
        document.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ') { e.preventDefault(); startOrRestart(); }
            if (e.key === 'ArrowLeft' && started && !dead) targetLane = Math.max(0, targetLane - 1);
            if (e.key === 'ArrowRight' && started && !dead) targetLane = Math.min(2, targetLane + 1);
        });
        document.addEventListener('keyup', e => keys[e.key] = false);

        // Touch
        let touchX = null;
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
            startOrRestart();
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!touchX || !started || dead) return;
            const dx = e.touches[0].clientX - touchX;
            if (Math.abs(dx) > 30) {
                if (dx < 0) targetLane = Math.max(0, targetLane - 1);
                else targetLane = Math.min(2, targetLane + 1);
                touchX = e.touches[0].clientX;
            }
        });

        function startOrRestart() {
            if (!started || dead) {
                started = true; dead = false;
                score = 0; gameSpeed = 3; targetLane = 1;
                player.x = LANES[1]; player.y = H - 120;
                obstacles = [];
                document.getElementById('msg').textContent = '';
            }
        }

        // Spawn
        let spawnTimer = 0;
        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const colors = ['#e74c3c', '#3498db', '#f39c12', '#9b59b6', '#1abc9c'];
            obstacles.push({
                x: LANES[lane],
                y: -CAR_H,
                color: colors[Math.floor(Math.random() * colors.length)],
            });
        }

        function collides(a, b) {
            return Math.abs(a.x - b.x) < CAR_W - 6 && Math.abs(a.y - b.y) < CAR_H - 6;
        }

        // Draw
        function drawRoad() {
            // Grass
            ctx.fillStyle = '#2d5a1e';
            ctx.fillRect(0, 0, W, H);

            // Road
            ctx.fillStyle = '#444';
            ctx.fillRect(ROAD_L, 0, ROAD_W, H);

            // Road edges
            ctx.fillStyle = '#fff';
            ctx.fillRect(ROAD_L - 3, 0, 4, H);
            ctx.fillRect(ROAD_R - 1, 0, 4, H);

            // Lane stripes
            ctx.fillStyle = '#ddd';
            for (const sy of stripes) {
                ctx.fillRect(ROAD_L + LANE_W + 28, sy, 4, 20);
                ctx.fillRect(ROAD_L + LANE_W * 2 + 28, sy, 4, 20);
            }
        }

        function drawCar(x, y, color, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            // Body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(-CAR_W/2, -CAR_H/2, CAR_W, CAR_H, 8);
            ctx.fill();

            // Windshield
            ctx.fillStyle = isPlayer ? 'rgba(150,200,255,0.6)' : 'rgba(100,100,100,0.5)';
            ctx.fillRect(-14, isPlayer ? -CAR_H/2 + 8 : CAR_H/2 - 22, 28, 14);

            // Wheels
            ctx.fillStyle = '#222';
            ctx.fillRect(-CAR_W/2 - 3, -18, 6, 14);
            ctx.fillRect(CAR_W/2 - 3, -18, 6, 14);
            ctx.fillRect(-CAR_W/2 - 3, 8, 6, 14);
            ctx.fillRect(CAR_W/2 - 3, 8, 6, 14);

            if (isPlayer) {
                // Headlights
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(-14, -CAR_H/2, 6, 5);
                ctx.fillRect(8, -CAR_H/2, 6, 5);
            } else {
                // Taillights
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(-14, CAR_H/2 - 5, 6, 5);
                ctx.fillRect(8, CAR_H/2 - 5, 6, 5);
            }

            ctx.restore();
        }

        function drawExplosion(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const r = 20 + Math.random() * 15;
                ctx.fillStyle = ['#ff4444', '#ff8800', '#ffdd00'][Math.floor(Math.random() * 3)];
                ctx.beginPath();
                ctx.arc(x + Math.cos(angle) * r, y + Math.sin(angle) * r, 6 + Math.random() * 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Update
        function update() {
            if (!started || dead) return;

            // Move player toward target lane
            const tx = LANES[targetLane];
            player.x += (tx - player.x) * 0.15;

            // Move stripes
            for (let i = 0; i < stripes.length; i++) {
                stripes[i] += gameSpeed;
                if (stripes[i] > H) stripes[i] -= H + 40;
            }

            // Spawn
            spawnTimer += gameSpeed;
            if (spawnTimer > 90) {
                spawnTimer = 0;
                spawnObstacle();
            }

            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += gameSpeed;
                if (obstacles[i].y > H + CAR_H) {
                    obstacles.splice(i, 1);
                    score++;
                    continue;
                }
                if (collides(player, obstacles[i])) {
                    dead = true;
                    if (score > best) {
                        best = score;
                        localStorage.setItem('raceBest', best);
                        document.getElementById('best').textContent = best;
                    }
                    document.getElementById('msg').textContent = 'CRASH!\nScore: ' + score + '\nPress SPACE to retry';
                }
            }

            // Speed up over time
            gameSpeed = 3 + score * 0.15;

            document.getElementById('score').textContent = score;
            document.getElementById('speed').textContent = Math.floor(gameSpeed * 20) + ' mph';
        }

        // Main loop
        function loop() {
            ctx.clearRect(0, 0, W, H);
            drawRoad();

            if (started) {
                for (const o of obstacles) drawCar(o.x, o.y, o.color, false);
                if (!dead) {
                    drawCar(player.x, player.y, '#00cc44', true);
                } else {
                    drawCar(player.x, player.y, '#666', true);
                    drawExplosion(player.x, player.y);
                }
            } else {
                drawCar(LANES[1], H - 120, '#00cc44', true);
            }

            update();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
