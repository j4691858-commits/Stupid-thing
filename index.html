<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat the Buzzer 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas { display: block; }

        #menu, #result {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: rgba(10,10,26,0.92);
            z-index: 20;
        }
        .hidden { display: none !important; }

        h1 {
            font-size: 2.5rem;
            color: #ff6b35;
            text-shadow: 0 3px 10px rgba(255,107,53,0.4);
            margin-bottom: 6px;
        }
        h2 { font-size: 1.3rem; color: #aaa; margin-bottom: 4px; }

        .pick-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        .choices {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 650px;
        }
        .btn {
            padding: 12px 22px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #16213e;
            color: #ddd;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn:hover { border-color: #ff6b35; color: #fff; background: #1a2744; transform: scale(1.05); }
        .btn.selected { border-color: #ff6b35; background: #2a1a0a; color: #ff6b35; }
        .btn.go {
            background: #ff6b35; color: #fff; border-color: #ff6b35;
            font-size: 1.1rem; padding: 14px 40px; margin-top: 10px;
        }
        .btn.go:hover { background: #e55a28; }
        .btn.go:disabled { opacity: 0.3; cursor: not-allowed; }
        .player-rating { font-size: 0.7rem; color: #888; margin-top: 2px; }

        #result h1 { font-size: 3rem; }
        .result-sub { color: #aaa; font-size: 1.1rem; }
        .result-score { color: #ffd700; font-size: 2rem; font-weight: 800; margin: 10px 0; }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="menu">
    <h1>BEAT THE BUZZER</h1>
    <h2>Make every shot before time runs out</h2>
    <div class="pick-label">Choose Your Player</div>
    <div class="choices" id="playerPicks"></div>
    <div class="pick-label">Choose Your Level</div>
    <div class="choices" id="levelPicks"></div>
    <button class="btn go" id="startBtn" disabled onclick="startGame()">START</button>
</div>

<div id="result" class="hidden">
    <h1 id="resultTitle">BUZZER!</h1>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-score" id="resultScore"></div>
    <button class="btn go" onclick="showMenu()">Play Again</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Data ---
const PLAYERS = [
    { name: 'Caleb Wilson', rating: 60 },
    { name: 'Cam Boozer', rating: 72 },
    { name: 'Jalen Brunson', rating: 85 },
    { name: 'Luka Doncic', rating: 90 },
    { name: 'Wemby', rating: 93 },
    { name: 'Shai Gilgeous-Alexander', rating: 96 },
    { name: 'LeBron James', rating: 97 },
];
const LEVELS = [
    { name: 'High School', timeMod: 1.3, greenMod: 1.3 },
    { name: 'College', timeMod: 1.0, greenMod: 1.0 },
    { name: 'NBA', timeMod: 0.8, greenMod: 0.8 },
    { name: 'All-Star', timeMod: 0.6, greenMod: 0.6 },
];
const SHOTS = [
    { name: 'Free Throw',    px: 5.8,  baseGreen: 45, speed: 2.5 },
    { name: 'Floater',       px: 7,    baseGreen: 38, speed: 3.0 },
    { name: 'Mid-Range',     px: 9,    baseGreen: 32, speed: 3.5 },
    { name: 'Three Pointer', px: 11.5, baseGreen: 26, speed: 4.0 },
    { name: 'Deep Three',    px: 14,   baseGreen: 20, speed: 4.8 },
    { name: 'Half Court',    px: 18,   baseGreen: 15, speed: 5.5 },
    { name: '3/4 Court',     px: 24,   baseGreen: 10, speed: 6.5 },
    { name: 'Full Court',    px: 30,   baseGreen: 7,  speed: 7.5 },
];

let selectedPlayer = null, selectedLevel = null;
let score = 0, shotIndex = 0, timeLeft = 0;
let needlePos = 0, needleDir = 1, greenStart = 0, greenWidth = 0, needleSpeed = 0;
let timerInterval = null, shooting = false, waitingNext = false, gameActive = false;
let ballAnim = null;

// ===========================================
// 3D SIDE-VIEW (TV BROADCAST) PROJECTION
// ===========================================
// World: X = along court (0=baseline/hoop, 32=far baseline)
//        Y = up
//        Z = across court width (-7.5 to 7.5), 0 = center
// Camera: side of court, elevated, looking across

const CAM = { x: 14, y: 7, z: -20 };
const LOOK = { x: 14, y: 1.5, z: 0 };

function project(wx, wy, wz) {
    const dx = wx - CAM.x;
    const dy = wy - CAM.y;
    const dz = wz - CAM.z;

    const fwd_x = LOOK.x - CAM.x;
    const fwd_y = LOOK.y - CAM.y;
    const fwd_z = LOOK.z - CAM.z;
    const fLen = Math.sqrt(fwd_x * fwd_x + fwd_y * fwd_y + fwd_z * fwd_z);
    const fx = fwd_x / fLen, fy = fwd_y / fLen, fz = fwd_z / fLen;

    const rMag = Math.sqrt(fx * fx + fz * fz);
    const right_x = -fz / rMag;
    const right_y = 0;
    const right_z = fx / rMag;

    const up_x = fy * right_z - fz * right_y;
    const up_y = fz * right_x - fx * right_z;
    const up_z = fx * right_y - fy * right_x;

    const cz = dx * fx + dy * fy + dz * fz;
    if (cz < 0.5) return null;
    const cx = dx * right_x + dy * right_y + dz * right_z;
    const cy = dx * up_x + dy * up_y + dz * up_z;

    const fov = Math.min(W, H) * 0.9;
    const sx = W / 2 + (cx / cz) * fov;
    const sy = H / 2 - (cy / cz) * fov;
    return { x: sx, y: sy, s: fov / cz };
}

// --- Drawing Helpers ---
function drawLine3d(x1, y1, z1, x2, y2, z2) {
    const a = project(x1, y1, z1);
    const b = project(x2, y2, z2);
    if (!a || !b) return;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
}

function drawPoly3d(points, fill, stroke) {
    const projected = points.map(p => project(p[0], p[1], p[2]));
    if (projected.some(p => !p)) return;
    ctx.beginPath();
    ctx.moveTo(projected[0].x, projected[0].y);
    for (let i = 1; i < projected.length; i++) ctx.lineTo(projected[i].x, projected[i].y);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}

function drawEllipse3d(cx, cy, cz, rx, rz, segs, close) {
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        const p = project(cx + Math.cos(a) * rx, cy, cz + Math.sin(a) * rz);
        if (!p) continue;
        if (first) { ctx.moveTo(p.x, p.y); first = false; }
        else ctx.lineTo(p.x, p.y);
    }
    if (close) ctx.closePath();
    ctx.stroke();
}

function drawArc3dH(cx, cy, cz, rx, rz, a1, a2, segs) {
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= segs; i++) {
        const a = a1 + (a2 - a1) * (i / segs);
        const p = project(cx + Math.cos(a) * rx, cy, cz + Math.sin(a) * rz);
        if (!p) continue;
        if (first) { ctx.moveTo(p.x, p.y); first = false; }
        else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
}

// ===========================================
// DRAW COURT (TV broadcast view)
// ===========================================
// NBA court: ~28.65m long, ~15.24m wide
const CL = 32; // court length
const CW = 7.5; // court half-width

function drawCourt() {
    // Court floor
    drawPoly3d(
        [[0, 0, -CW], [CL, 0, -CW], [CL, 0, CW], [0, 0, CW]],
        '#b5651d', null
    );

    // Wood grain lines
    ctx.strokeStyle = 'rgba(160,100,50,0.15)';
    ctx.lineWidth = 1;
    for (let z = -CW + 0.5; z < CW; z += 0.8) {
        drawLine3d(0, 0.01, z, CL, 0.01, z);
    }

    // Court boundary
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    drawLine3d(0, 0, -CW, CL, 0, -CW);
    drawLine3d(0, 0, CW, CL, 0, CW);
    drawLine3d(0, 0, -CW, 0, 0, CW);
    drawLine3d(CL, 0, -CW, CL, 0, CW);

    // Half court line
    drawLine3d(CL / 2, 0, -CW, CL / 2, 0, CW);

    // Center circle
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    drawEllipse3d(CL / 2, 0.01, 0, 1.8, 1.8, 32, true);

    // === LEFT HOOP SIDE (near baseline x=0) ===

    // Paint / key (lane)
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    drawLine3d(0, 0, -3, 5.8, 0, -3);
    drawLine3d(0, 0, 3, 5.8, 0, 3);
    drawLine3d(5.8, 0, -3, 5.8, 0, 3);

    // Paint fill
    drawPoly3d(
        [[0.1, 0.005, -2.9], [5.7, 0.005, -2.9], [5.7, 0.005, 2.9], [0.1, 0.005, 2.9]],
        'rgba(180,50,50,0.2)', null
    );

    // Free throw circle
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    drawEllipse3d(5.8, 0.01, 0, 1.8, 1.8, 32, true);

    // Three-point line (left side)
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    drawLine3d(0, 0, -CW + 0.9, 1.6, 0, -CW + 0.9);
    drawLine3d(0, 0, CW - 0.9, 1.6, 0, CW - 0.9);
    drawArc3dH(1.6, 0.01, 0, 7.2, 7.2, -Math.PI * 0.42, Math.PI * 0.42, 40);

    // Restricted area arc
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    drawArc3dH(1.6, 0.01, 0, 1.2, 1.2, -Math.PI * 0.5, Math.PI * 0.5, 16);

    // === RIGHT HOOP SIDE (far baseline, x=CL) ===
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.2;
    drawLine3d(CL, 0, -3, CL - 5.8, 0, -3);
    drawLine3d(CL, 0, 3, CL - 5.8, 0, 3);
    drawLine3d(CL - 5.8, 0, -3, CL - 5.8, 0, 3);
    drawEllipse3d(CL - 5.8, 0.01, 0, 1.8, 1.8, 32, true);
    drawLine3d(CL, 0, -CW + 0.9, CL - 1.6, 0, -CW + 0.9);
    drawLine3d(CL, 0, CW - 0.9, CL - 1.6, 0, CW - 0.9);
    drawArc3dH(CL - 1.6, 0.01, 0, 7.2, 7.2, Math.PI * 0.58, Math.PI * 1.42, 40);
}

// ===========================================
// DRAW HOOP (left side, x≈1.2)
// ===========================================
const HOOP_X = 1.2;
const RIM_Y = 3.05;

function drawHoop() {
    // Pole
    ctx.strokeStyle = '#777';
    ctx.lineWidth = 3;
    drawLine3d(0.15, 0, 0, 0.15, 4.2, 0);

    // Backboard
    ctx.lineWidth = 2;
    drawPoly3d(
        [[0.3, 2.5, -0.9], [0.3, 2.5, 0.9], [0.3, 4.2, 0.9], [0.3, 4.2, -0.9]],
        'rgba(200,200,220,0.45)', 'rgba(200,200,200,0.7)'
    );

    // Backboard square
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    drawPoly3d(
        [[0.32, 2.8, -0.45], [0.32, 2.8, 0.45], [0.32, 3.5, 0.45], [0.32, 3.5, -0.45]],
        null, 'rgba(255,255,255,0.4)'
    );

    // Rim
    ctx.strokeStyle = '#ee3300';
    ctx.lineWidth = 3;
    drawEllipse3d(HOOP_X, RIM_Y, 0, 0.45, 0.45, 16, true);

    // Net
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const nx = HOOP_X + Math.cos(a) * 0.45;
        const nz = Math.sin(a) * 0.45;
        drawLine3d(nx, RIM_Y, nz, HOOP_X + Math.cos(a) * 0.15, RIM_Y - 0.6, Math.sin(a) * 0.15);
    }
}

// ===========================================
// DRAW PLAYER (stick figure, side view)
// ===========================================
function drawPlayer(px) {
    const pz = 0;
    const facing = -1; // facing left toward hoop

    ctx.lineCap = 'round';

    // Feet
    const footSpread = 0.3;
    const fL = project(px - footSpread * facing, 0, pz - 0.15);
    const fR = project(px + footSpread * facing, 0, pz + 0.15);
    const hip = project(px, 1.0, pz);
    const shldr = project(px, 1.7, pz);
    const head = project(px - 0.1 * facing, 2.2, pz);
    const handShoot = project(px - 0.6 * facing, 2.3, pz);
    const handOff = project(px + 0.2 * facing, 1.3, pz);

    if (!fL || !fR || !hip || !shldr || !head || !handShoot || !handOff) return;

    // Shadow
    const sh1 = project(px - 0.5, 0.01, pz - 0.3);
    const sh2 = project(px + 0.5, 0.01, pz + 0.3);
    if (sh1 && sh2) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse((sh1.x + sh2.x) / 2, (sh1.y + sh2.y) / 2,
            Math.abs(sh2.x - sh1.x) / 2, Math.abs(sh2.y - sh1.y) / 2 + 3, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Legs
    ctx.strokeStyle = '#ff6b35';
    ctx.lineWidth = Math.max(shldr.s * 0.04, 3);
    ctx.beginPath(); ctx.moveTo(fL.x, fL.y); ctx.lineTo(hip.x, hip.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fR.x, fR.y); ctx.lineTo(hip.x, hip.y); ctx.stroke();

    // Shorts
    const shortsBot = project(px, 0.85, pz);
    if (shortsBot) {
        ctx.strokeStyle = '#cc4400';
        ctx.lineWidth = Math.max(shldr.s * 0.07, 5);
        ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(shortsBot.x, shortsBot.y); ctx.stroke();
    }

    // Body / jersey
    ctx.strokeStyle = '#ff6b35';
    ctx.lineWidth = Math.max(shldr.s * 0.06, 4);
    ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(shldr.x, shldr.y); ctx.stroke();

    // Arms
    ctx.lineWidth = Math.max(shldr.s * 0.03, 2.5);
    ctx.strokeStyle = '#e8a070';
    ctx.beginPath(); ctx.moveTo(shldr.x, shldr.y); ctx.lineTo(handShoot.x, handShoot.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(shldr.x, shldr.y); ctx.lineTo(handOff.x, handOff.y); ctx.stroke();

    // Head
    const headR = Math.max(head.s * 0.18, 6);
    ctx.fillStyle = '#e8a070';
    ctx.beginPath();
    ctx.arc(head.x, head.y, headR, 0, Math.PI * 2);
    ctx.fill();

    // Jersey number
    const jpos = project(px, 1.35, pz);
    if (jpos) {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(Math.floor(shldr.s * 0.12), 7)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('23', jpos.x, jpos.y);
    }
}

// ===========================================
// DRAW BASKETBALL
// ===========================================
function drawBall(bx, by, bz) {
    const p = project(bx, by, bz);
    if (!p) return;
    const r = Math.max(p.s * 0.09, 4);

    // Shadow
    const sh = project(bx, 0.01, bz);
    if (sh) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(sh.x, sh.y, r * 0.7, r * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Ball
    const grad = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.1, p.x, p.y, r);
    grad.addColorStop(0, '#f5a623');
    grad.addColorStop(0.6, '#d4781e');
    grad.addColorStop(1, '#a05a10');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Seams
    ctx.strokeStyle = 'rgba(80,40,0,0.4)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(p.x - r, p.y); ctx.lineTo(p.x + r, p.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x, p.y - r); ctx.lineTo(p.x, p.y + r); ctx.stroke();
}

// --- Ball trajectory (side view: arcs from player x toward hoop x) ---
function getBallPos(t, startX, hit) {
    const endX = HOOP_X;
    const endY = RIM_Y;
    const x = startX + (endX - startX) * t;
    const dist = startX - endX;
    const peakY = RIM_Y + 1.5 + dist * 0.15;
    const y = 2.2 + (peakY - 2.2) * 4 * t * (1 - t) + (endY - 2.2) * t;
    let z = 0;
    if (!hit && t > 0.82) {
        const bounce = (t - 0.82) * 5;
        return { x: x - bounce * 2, y: y - bounce * 4, z: z + bounce * 3 };
    }
    return { x, y, z };
}

// ===========================================
// DRAW ARENA BACKGROUND
// ===========================================
function drawBackground() {
    // Dark arena
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#050510');
    sky.addColorStop(0.3, '#0c0c22');
    sky.addColorStop(1, '#0a0a18');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Arena lights (overhead)
    for (let i = 0; i < 6; i++) {
        const lx = W * 0.1 + (W * 0.8) * (i / 5);
        const ly = H * 0.03;
        const grad = ctx.createRadialGradient(lx, ly, 0, lx, ly, 100);
        grad.addColorStop(0, 'rgba(255,240,200,0.12)');
        grad.addColorStop(1, 'rgba(255,240,200,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(lx - 100, ly - 50, 200, 200);
        ctx.fillStyle = 'rgba(255,255,220,0.7)';
        ctx.fillRect(lx - 6, ly, 12, 4);
    }

    // Far-side crowd (behind court, upper area)
    const crowdTop = H * 0.12;
    for (let row = 0; row < 8; row++) {
        const y = crowdTop + row * 14;
        const density = 80;
        for (let i = 0; i < density; i++) {
            const x = (i / density) * W + Math.sin(i * 7.3 + row * 4.1) * 5;
            const hue = (i * 41 + row * 70) % 360;
            const bright = 25 + row * 3;
            ctx.fillStyle = `hsla(${hue}, 40%, ${bright}%, 0.5)`;
            ctx.fillRect(x, y, 7, 9);
            ctx.fillStyle = `hsla(${hue}, 25%, ${bright + 15}%, 0.6)`;
            ctx.beginPath();
            ctx.arc(x + 3.5, y - 2.5, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Scoreboard
    const sbx = W / 2, sby = H * 0.04;
    ctx.fillStyle = 'rgba(20,20,40,0.8)';
    ctx.beginPath();
    ctx.roundRect(sbx - 80, sby, 160, 28, 6);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,50,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Light glow on court
    const courtGlow = ctx.createRadialGradient(W * 0.4, H * 0.5, 0, W * 0.4, H * 0.5, W * 0.5);
    courtGlow.addColorStop(0, 'rgba(255,240,200,0.06)');
    courtGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = courtGlow;
    ctx.fillRect(0, 0, W, H);
}

// ===========================================
// DRAW TV OVERLAY / HUD
// ===========================================
function drawHUD() {
    // Scorebug (bottom left, like ESPN)
    const bw = 280, bh = 50;
    const bx = 20, by = H - 160;

    ctx.fillStyle = 'rgba(15,15,30,0.85)';
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,100,50,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Score
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('SCORE', bx + 12, by + 18);
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText(score.toString(), bx + 80, by + 18);

    // Shot name
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = '#ff6b35';
    const shot = SHOTS[shotIndex];
    ctx.fillText(shot ? shot.name.toUpperCase() : '', bx + 12, by + 40);

    // Timer
    ctx.fillStyle = 'rgba(15,15,30,0.85)';
    ctx.beginPath();
    ctx.roundRect(bx + bw + 8, by, 80, bh, 8);
    ctx.fill();
    ctx.strokeStyle = timeLeft < 5 ? 'rgba(255,50,50,0.7)' : 'rgba(255,100,50,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.font = 'bold 26px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = timeLeft < 5 ? '#ff2222' : '#fff';
    ctx.fillText(timeLeft.toFixed(1), bx + bw + 48, by + bh / 2 + 2);

    // Shot counter (top right)
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`Shot ${Math.min(shotIndex + 1, SHOTS.length)} of ${SHOTS.length}`, W - 20, 30);
}

// --- Timing Bar ---
function drawTimingBar() {
    const barW = 340, barH = 40;
    const bx = W / 2 - barW / 2;
    const by = H - 70;

    ctx.fillStyle = 'rgba(15,15,30,0.85)';
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(bx, by, barW, barH, 8);
    ctx.fill();
    ctx.stroke();

    // Green zone
    ctx.fillStyle = 'rgba(0,200,80,0.3)';
    ctx.fillRect(bx + greenStart, by + 1, greenWidth, barH - 2);
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx + greenStart, by); ctx.lineTo(bx + greenStart, by + barH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx + greenStart + greenWidth, by); ctx.lineTo(bx + greenStart + greenWidth, by + barH); ctx.stroke();

    // Needle
    if (!waitingNext) {
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 10;
        ctx.fillRect(bx + needlePos - 1.5, by, 3, barH);
        ctx.shadowBlur = 0;
    }

    ctx.fillStyle = '#666';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('SPACE / Click / Tap when the line is in the green', W / 2, by + barH + 6);
}

// --- Feedback ---
let feedbackText = '', feedbackColor = '#fff', feedbackTimer = 0;
function showFeedback(msg, color) {
    feedbackText = msg; feedbackColor = color; feedbackTimer = 60;
}
function drawFeedback() {
    if (feedbackTimer <= 0) return;
    feedbackTimer--;
    const alpha = Math.min(feedbackTimer / 20, 1);
    const sc = 1 + (60 - feedbackTimer) * 0.004;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${Math.floor(52 * sc)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = feedbackColor;
    ctx.shadowColor = feedbackColor;
    ctx.shadowBlur = 25;
    ctx.fillText(feedbackText, W / 2, H * 0.38);
    ctx.restore();
    ctx.shadowBlur = 0;
}

// ===========================================
// MENU
// ===========================================
const playerDiv = document.getElementById('playerPicks');
PLAYERS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML = p.name + `<div class="player-rating">OVR ${p.rating}</div>`;
    b.onclick = () => { selectedPlayer = i; playerDiv.querySelectorAll('.btn').forEach((bb, j) => bb.classList.toggle('selected', j === i)); checkReady(); };
    playerDiv.appendChild(b);
});
const levelDiv = document.getElementById('levelPicks');
LEVELS.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = l.name;
    b.onclick = () => { selectedLevel = i; levelDiv.querySelectorAll('.btn').forEach((bb, j) => bb.classList.toggle('selected', j === i)); checkReady(); };
    levelDiv.appendChild(b);
});
function checkReady() {
    document.getElementById('startBtn').disabled = selectedPlayer === null || selectedLevel === null;
}

// ===========================================
// GAME LOGIC
// ===========================================
function startGame() {
    score = 0; shotIndex = 0; timeLeft = 24.0;
    gameActive = true; ballAnim = null;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('result').classList.add('hidden');
    setupShot();
    startTimer();
}

function getGreenWidth(shot) {
    const player = PLAYERS[selectedPlayer];
    const level = LEVELS[selectedLevel];
    const ratingBonus = (player.rating - 60) / 37 * 0.6 + 0.7;
    return Math.max(shot.baseGreen * ratingBonus * level.greenMod, 5);
}

function setupShot() {
    const shot = SHOTS[shotIndex];
    const barW = 340;
    greenWidth = getGreenWidth(shot);
    needleSpeed = shot.speed / LEVELS[selectedLevel].timeMod;
    greenStart = Math.random() * (barW - greenWidth - 20) + 10;
    needlePos = 0; needleDir = 1;
    shooting = false; waitingNext = false;
    ballAnim = null;
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) { timeLeft = 0; clearInterval(timerInterval); endGame(); }
    }, 100);
}

function shoot() {
    if (shooting || waitingNext || !gameActive) return;
    shooting = true;
    const hit = needlePos >= greenStart && needlePos <= greenStart + greenWidth;
    const shot = SHOTS[shotIndex];
    ballAnim = { t: 0, duration: 55, startX: shot.px, hit };

    if (hit) {
        const dist = needlePos - greenStart;
        const center = greenWidth / 2;
        const accuracy = 1 - Math.abs(dist - center) / center;
        let msg, color;
        if (accuracy > 0.85) { msg = 'PERFECT!'; color = '#00ff88'; }
        else if (accuracy > 0.5) { msg = 'SWISH!'; color = '#44dd44'; }
        else { msg = 'Good!'; color = '#88cc44'; }

        setTimeout(() => { showFeedback(msg, color); score++; }, 750);
        waitingNext = true;
        setTimeout(() => {
            shotIndex++;
            if (shotIndex >= SHOTS.length) endGame(true);
            else setupShot();
        }, 1500);
    } else {
        setTimeout(() => showFeedback('MISS!', '#ff4444'), 750);
        waitingNext = true;
        setTimeout(() => setupShot(), 1500);
    }
}

function endGame(allMade) {
    gameActive = false;
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('result').classList.remove('hidden');
    const title = document.getElementById('resultTitle');
    const sub = document.getElementById('resultSub');
    const sc = document.getElementById('resultScore');
    const player = PLAYERS[selectedPlayer];
    const level = LEVELS[selectedLevel];
    if (allMade) {
        title.textContent = 'YOU WIN!'; title.style.color = '#00ff88';
        sub.textContent = `${player.name} hit every shot on ${level.name}!`;
    } else {
        title.textContent = 'BUZZER!'; title.style.color = '#ff4444';
        sub.textContent = `Time's up! ${player.name} on ${level.name}`;
    }
    sc.textContent = score + ' / ' + SHOTS.length + ' shots made';
}

function showMenu() {
    document.getElementById('result').classList.add('hidden');
    document.getElementById('menu').classList.remove('hidden');
    gameActive = false;
    selectedPlayer = null; selectedLevel = null;
    playerDiv.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
    levelDiv.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('startBtn').disabled = true;
}

// --- Input ---
document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); shoot(); }
});
canvas.addEventListener('click', () => { if (gameActive) shoot(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (gameActive) shoot(); });

// ===========================================
// MAIN LOOP
// ===========================================
function loop() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawCourt();

    const shot = SHOTS[shotIndex];
    const px = shot ? shot.px : 8;

    if (gameActive) {
        drawPlayer(px);

        if (ballAnim) {
            ballAnim.t += 1 / ballAnim.duration;
            if (ballAnim.t > 1) ballAnim.t = 1;
            const bp = getBallPos(ballAnim.t, ballAnim.startX, ballAnim.hit);
            drawBall(bp.x, bp.y, bp.z);
        } else {
            drawBall(px - 0.5, 2.3, 0);
        }

        drawHoop();

        if (!shooting && !waitingNext) {
            needlePos += needleDir * needleSpeed;
            if (needlePos >= 337) { needlePos = 337; needleDir = -1; }
            if (needlePos <= 0) { needlePos = 0; needleDir = 1; }
        }

        drawTimingBar();
        drawHUD();
        drawFeedback();
    } else {
        drawPlayer(8);
        drawBall(7.5, 2.3, 0);
        drawHoop();
    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
