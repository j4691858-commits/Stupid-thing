<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat the Buzzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #menu, #game, #result {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }
        .hidden { display: none !important; }

        h1 {
            font-size: 2.5rem;
            color: #ff6b35;
            text-shadow: 0 3px 10px rgba(255,107,53,0.4);
            margin-bottom: 6px;
        }
        h2 { font-size: 1.3rem; color: #aaa; margin-bottom: 4px; }

        .pick-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .choices {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 600px;
        }

        .btn {
            padding: 12px 22px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #16213e;
            color: #ddd;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn:hover { border-color: #ff6b35; color: #fff; background: #1a2744; transform: scale(1.05); }
        .btn.selected { border-color: #ff6b35; background: #2a1a0a; color: #ff6b35; }
        .btn.go {
            background: #ff6b35;
            color: #fff;
            border-color: #ff6b35;
            font-size: 1.1rem;
            padding: 14px 40px;
            margin-top: 10px;
        }
        .btn.go:hover { background: #e55a28; }
        .btn.go:disabled { opacity: 0.3; cursor: not-allowed; }

        .player-rating { font-size: 0.7rem; color: #888; margin-top: 2px; }

        /* HUD */
        #hud {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            z-index: 10;
        }
        #hud div { font-size: 1rem; font-weight: 700; }
        #hud .shot-name { color: #ff6b35; font-size: 1.2rem; }
        #hud .score-display { color: #ffd700; font-size: 1.3rem; }
        #hud .timer { color: #ff4444; font-size: 1.5rem; font-family: monospace; }

        /* Court */
        #court {
            width: 360px;
            height: 200px;
            background: #c47a3a;
            border: 3px solid #8b5e2a;
            border-radius: 8px;
            position: relative;
            margin-bottom: 10px;
        }
        .court-line {
            position: absolute;
            background: #fff;
            opacity: 0.5;
        }
        .half-line { width: 100%; height: 2px; top: 50%; }
        .three-arc {
            width: 140px; height: 70px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 0 0 70px 70px;
            border-top: none;
            background: none;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .hoop {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px; height: 20px;
            border: 3px solid #ff4444;
            border-radius: 50%;
        }
        .backboard {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 4px;
            background: #ddd;
        }
        .player-dot {
            position: absolute;
            width: 16px; height: 16px;
            background: #ff6b35;
            border: 2px solid #fff;
            border-radius: 50%;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.4s ease;
        }

        /* Timing bar */
        #timing {
            width: 320px;
            height: 50px;
            background: #222;
            border-radius: 8px;
            position: relative;
            border: 2px solid #444;
            overflow: hidden;
            cursor: pointer;
        }
        #greenZone {
            position: absolute;
            height: 100%;
            background: rgba(0,200,80,0.35);
            border-left: 2px solid #0f0;
            border-right: 2px solid #0f0;
        }
        #needle {
            position: absolute;
            top: 0;
            width: 3px;
            height: 100%;
            background: #fff;
            box-shadow: 0 0 8px #fff;
            transition: none;
        }
        #timing-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }

        /* Result screen */
        #result h1 { font-size: 3rem; }
        .result-sub { color: #aaa; font-size: 1.1rem; }
        .result-score { color: #ffd700; font-size: 2rem; font-weight: 800; margin: 10px 0; }
    </style>
</head>
<body>

<!-- MENU -->
<div id="menu">
    <h1>BEAT THE BUZZER</h1>
    <h2>Make every shot before time runs out</h2>

    <div class="pick-label">Choose Your Player</div>
    <div class="choices" id="playerPicks"></div>

    <div class="pick-label">Choose Your Level</div>
    <div class="choices" id="levelPicks"></div>

    <button class="btn go" id="startBtn" disabled onclick="startGame()">START</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">
    <div id="hud">
        <div class="score-display">Score: <span id="scoreNum">0</span></div>
        <div class="shot-name" id="shotName">Free Throw</div>
        <div class="timer" id="timer">24.0</div>
    </div>

    <div id="court">
        <div class="court-line half-line"></div>
        <div class="three-arc"></div>
        <div class="backboard"></div>
        <div class="hoop"></div>
        <div class="player-dot" id="playerDot"></div>
    </div>

    <div id="shotLabel" style="font-size:1.1rem; color:#ff6b35; font-weight:700; margin-bottom:4px;"></div>
    <div id="timing">
        <div id="greenZone"></div>
        <div id="needle"></div>
    </div>
    <div id="timing-label">Click / Tap / Press SPACE when the line is in the green!</div>
    <div id="feedback" style="font-size:1.4rem; font-weight:800; height:30px; margin-top:6px;"></div>
</div>

<!-- RESULT -->
<div id="result" class="hidden">
    <h1 id="resultTitle">BUZZER!</h1>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-score" id="resultScore"></div>
    <button class="btn go" onclick="showMenu()">Play Again</button>
</div>

<script>
    // --- Data ---
    const PLAYERS = [
        { name: 'Caleb Wilson',  rating: 60 },
        { name: 'Cam Boozer',    rating: 72 },
        { name: 'Jalen Brunson', rating: 85 },
        { name: 'Luka Doncic',   rating: 90 },
        { name: 'Wemby',         rating: 93 },
        { name: 'LeBron James',  rating: 97 },
    ];

    const LEVELS = [
        { name: 'High School', timeMod: 1.3, greenMod: 1.3 },
        { name: 'College',     timeMod: 1.0, greenMod: 1.0 },
        { name: 'NBA',         timeMod: 0.8, greenMod: 0.8 },
        { name: 'All-Star',    timeMod: 0.6, greenMod: 0.6 },
    ];

    const SHOTS = [
        { name: 'Free Throw',   dist: 20,  baseGreen: 45, speed: 2.5 },
        { name: 'Floater',      dist: 30,  baseGreen: 38, speed: 3.0 },
        { name: 'Mid-Range',    dist: 45,  baseGreen: 32, speed: 3.5 },
        { name: 'Three Pointer',dist: 65,  baseGreen: 26, speed: 4.0 },
        { name: 'Deep Three',   dist: 78,  baseGreen: 20, speed: 4.8 },
        { name: 'Half Court',   dist: 100, baseGreen: 15, speed: 5.5 },
        { name: '3/4 Court',    dist: 140, baseGreen: 10, speed: 6.5 },
        { name: 'Full Court',   dist: 180, baseGreen: 7,  speed: 7.5 },
    ];

    let selectedPlayer = null, selectedLevel = null;
    let score = 0, shotIndex = 0, timeLeft = 0;
    let needlePos = 0, needleDir = 1, greenStart = 0, greenWidth = 0, needleSpeed = 0;
    let animFrame = null, timerInterval = null, shooting = false, waitingNext = false;

    // --- Build Menu ---
    const playerDiv = document.getElementById('playerPicks');
    PLAYERS.forEach((p, i) => {
        const b = document.createElement('button');
        b.className = 'btn';
        b.innerHTML = p.name + `<div class="player-rating">OVR ${p.rating}</div>`;
        b.onclick = () => pickPlayer(i);
        playerDiv.appendChild(b);
    });

    const levelDiv = document.getElementById('levelPicks');
    LEVELS.forEach((l, i) => {
        const b = document.createElement('button');
        b.className = 'btn';
        b.textContent = l.name;
        b.onclick = () => pickLevel(i);
        levelDiv.appendChild(b);
    });

    function pickPlayer(i) {
        selectedPlayer = i;
        playerDiv.querySelectorAll('.btn').forEach((b, j) => b.classList.toggle('selected', j === i));
        checkReady();
    }
    function pickLevel(i) {
        selectedLevel = i;
        levelDiv.querySelectorAll('.btn').forEach((b, j) => b.classList.toggle('selected', j === i));
        checkReady();
    }
    function checkReady() {
        document.getElementById('startBtn').disabled = selectedPlayer === null || selectedLevel === null;
    }

    // --- Game ---
    function startGame() {
        score = 0;
        shotIndex = 0;
        timeLeft = 24.0;

        show('game');
        document.getElementById('scoreNum').textContent = '0';

        setupShot();
        startTimer();
    }

    function getGreenWidth(shot) {
        const player = PLAYERS[selectedPlayer];
        const level = LEVELS[selectedLevel];
        const ratingBonus = (player.rating - 60) / 37 * 0.6 + 0.7;
        return Math.max(shot.baseGreen * ratingBonus * level.greenMod, 5);
    }

    function getNeedleSpeed(shot) {
        const level = LEVELS[selectedLevel];
        return shot.speed / level.timeMod;
    }

    function setupShot() {
        const shot = SHOTS[shotIndex];
        const bar = document.getElementById('timing');
        const barW = 320;

        greenWidth = getGreenWidth(shot);
        needleSpeed = getNeedleSpeed(shot);

        greenStart = Math.random() * (barW - greenWidth - 20) + 10;

        const gz = document.getElementById('greenZone');
        gz.style.left = greenStart + 'px';
        gz.style.width = greenWidth + 'px';

        needlePos = 0;
        needleDir = 1;
        shooting = false;
        waitingNext = false;

        document.getElementById('shotName').textContent = shot.name;
        document.getElementById('shotLabel').textContent = shot.name;
        document.getElementById('feedback').textContent = '';

        // Position player on court
        const dot = document.getElementById('playerDot');
        dot.style.bottom = Math.min(shot.dist, 180) + 'px';

        startNeedle();
    }

    function startNeedle() {
        if (animFrame) cancelAnimationFrame(animFrame);
        function tick() {
            if (shooting || waitingNext) return;
            needlePos += needleDir * needleSpeed;
            if (needlePos >= 317) { needlePos = 317; needleDir = -1; }
            if (needlePos <= 0) { needlePos = 0; needleDir = 1; }
            document.getElementById('needle').style.left = needlePos + 'px';
            animFrame = requestAnimationFrame(tick);
        }
        animFrame = requestAnimationFrame(tick);
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                clearInterval(timerInterval);
                endGame();
            }
            document.getElementById('timer').textContent = timeLeft.toFixed(1);
        }, 100);
    }

    function shoot() {
        if (shooting || waitingNext) return;
        shooting = true;

        const hit = needlePos >= greenStart && needlePos <= greenStart + greenWidth;
        const fb = document.getElementById('feedback');

        if (hit) {
            const dist = needlePos - greenStart;
            const center = greenWidth / 2;
            const accuracy = 1 - Math.abs(dist - center) / center;

            let msg, color;
            if (accuracy > 0.85) { msg = 'PERFECT!'; color = '#00ff88'; }
            else if (accuracy > 0.5) { msg = 'SWISH!'; color = '#44dd44'; }
            else { msg = 'Good!'; color = '#88cc44'; }

            fb.textContent = msg;
            fb.style.color = color;
            score++;
            document.getElementById('scoreNum').textContent = score;

            waitingNext = true;
            setTimeout(() => {
                shotIndex++;
                if (shotIndex >= SHOTS.length) {
                    endGame(true);
                } else {
                    setupShot();
                }
            }, 600);
        } else {
            fb.textContent = 'MISS!';
            fb.style.color = '#ff4444';

            waitingNext = true;
            setTimeout(() => {
                setupShot();
            }, 600);
        }
    }

    function endGame(allMade) {
        if (timerInterval) clearInterval(timerInterval);
        if (animFrame) cancelAnimationFrame(animFrame);

        show('result');
        const title = document.getElementById('resultTitle');
        const sub = document.getElementById('resultSub');
        const sc = document.getElementById('resultScore');

        const player = PLAYERS[selectedPlayer];
        const level = LEVELS[selectedLevel];

        if (allMade) {
            title.textContent = 'YOU WIN!';
            title.style.color = '#00ff88';
            sub.textContent = `${player.name} hit every shot on ${level.name}!`;
        } else {
            title.textContent = 'BUZZER!';
            title.style.color = '#ff4444';
            sub.textContent = `Time's up! ${player.name} on ${level.name}`;
        }
        sc.textContent = score + ' / ' + SHOTS.length + ' shots made';
    }

    function showMenu() {
        show('menu');
        selectedPlayer = null;
        selectedLevel = null;
        playerDiv.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
        levelDiv.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('startBtn').disabled = true;
    }

    function show(id) {
        ['menu', 'game', 'result'].forEach(s => {
            document.getElementById(s).classList.toggle('hidden', s !== id);
        });
    }

    // --- Input ---
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); shoot(); }
    });
    document.getElementById('timing').addEventListener('click', shoot);
    document.getElementById('timing').addEventListener('touchstart', e => { e.preventDefault(); shoot(); });
</script>
</body>
</html>
